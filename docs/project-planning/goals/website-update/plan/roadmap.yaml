# Antiky Labs roadmap DSL.
# Stages and items render in the order listed here.
# Supported stage kinds: release, horizon, destination.

schema: antiky-roadmap/v1

title: Antiky Labs roadmap
intro: >-
  We are building one complete loop: agents can understand and change a game,
  people can see and direct the work, and every new capability is proven in
  something playable.
notice: >-
  This roadmap describes release scope, not dates. Work beyond v0.4 earns a
  release number only after it has a plan and a concrete proving case.

stages:
  - id: v0-1
    kind: release
    label: "v0.1"
    title: "Put the foundation in people's hands"
    subtitle: >-
      Release a coherent first version of Framework, Studio, agent tools,
      demos, documentation, and the website—open, understandable, and ready to
      try.
    items:
      - title: Framework and agent tools
        description: >-
          Fixed-step sessions, stable entity IDs, point-light authoring and
          correction, bounded inspection and capture, and CLI/MCP project and
          session controls.
      - title: Studio
        description: >-
          A macOS app with project launch, live game view, native terminal,
          simulation controls, inspection, and activity history.
      - title: Demos and website
        description: >-
          Antiky Town, Combat Arena, Point Light Expo, and Traversal Study with
          current screenshots and click-to-play builds; Emberwyrd remains
          separate from the technical demos.
      - title: Docs and release
        description: >-
          Current product, API, and skills documentation; a resource hub for
          the CC0 asset and skills libraries; shader and project libraries
          marked as coming soon; and versioned release and packaging automation
          after pointer input, terminal exit handling, and terminal crashes are
          fixed in Studio.

  - id: v0-2
    kind: release
    label: "v0.2"
    title: Make the game part of the conversation
    subtitle: >-
      Click something in a running game, carry its exact identity and context
      into the coding agent you already use, and turn human feedback into a
      safe, inspectable change.
    items:
      - title: 2D selection proof
        description: >-
          Reusable position and camera behavior plus GPU picking from a
          displayed pixel to a stable Framework entity selected in Studio,
          proven by a checked-in Antiky/BroMetal example.
      - title: Agent conversation
        description: >-
          A native ACP v1 panel for one installed compatible coding agent. The
          selected entity's bounded project, world, hierarchy, component,
          render, and asset context can follow it into the conversation; Antiky
          MCP remains the agent-to-engine connection.
      - title: Studio workflow
        description: >-
          Rearrangeable panels, attached and detached modes, and
          click-to-comment feedback on a running scene.
      - title: Agent tooling
        description: >-
          MCP code mode, interpretation of motion measurements, and the first
          Antiky, BroMetal, game-development, Studio, and MCP skills.

  - id: v0-3
    kind: release
    label: "v0.3"
    title: Grow the game-making core
    subtitle: >-
      Build input, movement, sprite animation, camera and presentation
      controls, and the first mini-app foundation through real game slices in
      2D, 3D, and everything in between.
    items:
      - title: Input
        description: Captured game input and reusable controls.
      - title: Animation
        description: >-
          First-class sprite flipbooks with animation and character-movement
          timing.
      - title: Presentation
        description: Field-of-view and vignette controls.
      - title: Studio extensions
        description: >-
          Mini apps for complete workspaces and gadgets for focused panel
          additions.

  - id: v0-4
    kind: release
    label: "v0.4"
    title: Turn Studio into a creator workspace
    subtitle: >-
      Use the mini-app foundation to add focused tools for assets, sprites,
      flipbooks, and properties, so Studio changes to fit the work instead of
      becoming one enormous editor.
    items:
      - title: Asset browser
        description: Find catalog assets and bring them into the project workflow.
      - title: Sprite editor
        description: Inspect and edit sprite content.
      - title: Flipbook editor
        description: Assemble and tune frame-based animation.
      - title: Object properties
        description: >-
          Inspect and edit object settings through Framework-owned commands.

  - id: beyond
    kind: horizon
    label: Beyond
    title: Build a creative library agents can understand
    subtitle: >-
      Grow the CC0 asset catalog alongside shader, project, and skills
      libraries, giving people and agents trusted building blocks they can
      actually find, understand, and reuse.
    note: These items are not assigned to a release yet.
    items:
      - title: Tutorials
        description: Getting-started and build-a-game tutorials.
      - title: Asset and shader libraries
        description: >-
          Semantic inventories inside asset packs and a large BroMetal shader
          catalog with a smaller supported core.
      - title: Project and skills libraries
        description: >-
          A project library and an expanded skills library for Antiky,
          BroMetal, Studio, MCP, and game development.
      - title: Physics
        description: >-
          Rapier CPU physics, Nexus GPU physics, and the Nexus-to-BroMetal
          render path.
      - title: Examples
        description: >-
          Selected open-source Three.js and BroMetal games rebuilt as Antiky
          examples.

  - id: destination
    kind: destination
    label: The destination
    title: Ship games that prove the idea
    subtitle: >-
      Use Antiky to create complete, memorable games—and let those games earn
      the reusable systems, production tooling, performance evidence, and
      online capabilities the platform needs next.
    items:
      - title: Independent games
        description: Complete games that build, run, and ship without Studio.
      - title: Game-earned systems
        description: >-
          Reusable abilities, physics, rendering, asset, and online systems
          extracted from working game slices instead of designed from a feature
          checklist.
      - title: Release evidence
        description: >-
          Repeatable scenarios, performance budgets, build artifacts, and
          release evidence tied to the exact game version they prove.
